# Remote rclone BSTRDZ (7.1) — AUCUN secret ici (fichier versionné).
# Identifiants lus dans l'environnement (env_auth) : AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY,
# point d'accès : RCLONE_S3_ENDPOINT — exportés depuis les secrets Codespaces R2_* par
# scripts/media/r2-env.sh.
[bstrdz-r2]
type = s3
provider = Cloudflare
env_auth = true
region = auto
acl = private
# Jeton limité au bucket bstrdz-media : jamais de création / vérification de bucket
no_check_bucket = true
